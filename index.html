<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorsport RSS</title>
<meta name="theme-color" content="#d6211e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 路面の明るいグレーと、縁石の赤 */
  --bg: #eceff1; --surface: #ffffff; --text: #14171a; --muted: #5a626a;
  --line: #d8dde2; --accent: #d6211e; --accent-soft: #fde7e5; --chip: #e3e7eb;
  --read: #8b939b; --maxw: 1400px;
  /* シリーズごとの色（記事の左の帯・タブ・タグ） */
  --s-f1: #d6211e; --s-motogp: #1c6fd1; --s-supergt: #e8590c; --s-superformula: #c2255c;
  --s-wec: #6741d9; --s-wrc: #8a5a2b; --s-indy: #0b7c8c; --s-fe: #2b8a3e; --s-other: #7a828a;
  --num: "Saira Semi Condensed", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --surface: #1d2126; --text: #eaedf0; --muted: #98a1ab;
    --line: #2c3238; --accent: #ff4d40; --accent-soft: #3b1a17; --chip: #272c32;
    --read: #6c747c;
    --s-f1: #ff5a4e; --s-motogp: #5aa2ff; --s-supergt: #ff8a3d; --s-superformula: #f0659a;
    --s-wec: #9b7bff; --s-wrc: #d1965e; --s-indy: #3cc3d4; --s-fe: #55c26b; --s-other: #9aa2aa;
    color-scheme: dark;
  }
}
[data-cat="f1"] { --c: var(--s-f1); } [data-cat="motogp"] { --c: var(--s-motogp); }
[data-cat="supergt"] { --c: var(--s-supergt); } [data-cat="superformula"] { --c: var(--s-superformula); }
[data-cat="wec"] { --c: var(--s-wec); } [data-cat="wrc"] { --c: var(--s-wrc); } [data-cat="indy"] { --c: var(--s-indy); }
[data-cat="fe"] { --c: var(--s-fe); } [data-cat="other"], [data-cat="all"] { --c: var(--s-other); }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }

/* ---- ヘッダー ---- */
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { max-width: var(--maxw); margin: 0 auto; padding: 10px 16px 4px; display: flex; align-items: center; gap: 16px; }
.logo { margin: 0; font-family: var(--num); font-size: 21px; font-weight: 700; letter-spacing: .01em; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
/* 縁石の赤白ストライプ */
.kerb { width: 26px; height: 12px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 6.5px, #fff 6.5px 13px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.updated { color: var(--muted); font-size: 12px; white-space: nowrap; }
.updated.stale { color: var(--accent); }
.refresh { font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; white-space: nowrap; }
.refresh:hover { border-color: var(--text); }
.refresh:disabled { opacity: .6; cursor: default; }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.seg.view button { font-size: 14px; padding: 5px 16px; }

.msg { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); font-size: 13px; padding: 9px 16px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 40; }
.msg.show { opacity: 1; transform: translate(-50%, 0); }

/* カテゴリーのタブと「絞り込み」ボタン */
.navrow { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 8px; }
#tabs { flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
#tabs::-webkit-scrollbar { display: none; }
#tabs button { flex: none; border: 0; background: none; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px;
  padding: 10px 11px 11px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
#tabs button:hover { color: var(--text); }
#tabs button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--c); }
#tabs button i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
#tabs button[data-cat="all"] i { display: none; }
#tabs button small { font-family: var(--num); font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.filter-btn { flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.filter-btn:hover, .filter-btn[aria-expanded="true"] { border-color: var(--text); }
.filter-btn svg { width: 15px; height: 15px; }
.filter-btn .count[hidden] { display: none; }
.filter-btn .count { font-family: var(--num); background: var(--accent); color: #fff; border-radius: 999px; min-width: 18px; height: 18px;
  font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
body.view-schedule .filter-btn, body.view-schedule .chips { display: none; }

/* 絞り込みパネル */
.filters { display: none; max-width: var(--maxw); margin: 0 auto; padding: 12px 16px 14px; gap: 12px 20px; flex-wrap: wrap; align-items: flex-end;
  border-top: 1px solid var(--line); }
body.filters-open .filters { display: flex; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field.search { flex: 1 1 260px; }
input[type=search], select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); border-radius: 8px; }
label.chk { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; padding-bottom: 7px; }
.filters .actions { display: flex; gap: 8px; margin-left: auto; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.ghost:hover { border-color: var(--text); }
.ghost.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
.sheet-backdrop { display: none; }

/* 使っている絞り込み条件（チップ） */
.chips { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; display: flex; gap: 6px; flex-wrap: wrap; }
.chips:not(:empty) { padding-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 2px 6px 2px 11px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.chip:hover { border-color: var(--text); }
.chip span { font-size: 15px; line-height: 1; color: var(--muted); }
.chip.clear { background: none; border-color: transparent; text-decoration: underline; padding: 2px 6px; color: var(--muted); }

/* ---- 本文 ---- */
.layout { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 28px; align-items: start; }
main { min-width: 0; padding: 6px 0 64px; }

/* 次のレース（カウントダウン） */
.next-board { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 16px; align-items: center; margin: 14px 0 6px;
  padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c);
  border-radius: 10px; color: var(--text); text-decoration: none; cursor: pointer; }
.next-board:hover { border-color: var(--c); }
.nb-label { grid-column: 1 / 3; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.nb-label .tag { margin: 0; }
.nb-name { font-size: 20px; font-weight: 700; line-height: 1.3; }
.nb-when { grid-column: 1 / 3; font-size: 13px; color: var(--muted); }
.nb-count { grid-column: 3; grid-row: 1 / 4; text-align: right; line-height: 1.1; }
.nb-count small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.nb-count b { font-family: var(--num); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 700; letter-spacing: .01em; color: var(--c); }
.nb-count b.live { font-size: 22px; }

/* 記事 */
.item { position: relative; display: flex; gap: 16px; padding: 14px 0 14px 16px; border-bottom: 1px solid var(--line); }
.item::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--c); }
.item.read::before { opacity: .35; }
.item .body { flex: 1; min-width: 0; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.src { font-weight: 600; color: var(--text); }
.tag { color: var(--c, var(--s-other)); background: color-mix(in srgb, var(--c, var(--s-other)) 13%, transparent);
  border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.new { color: var(--accent); font-weight: 700; font-size: 11px; }
.item a.title { display: block; color: var(--text); text-decoration: none; font-weight: 650; font-size: 16.5px; line-height: 1.45; margin: 4px 0 3px; overflow-wrap: anywhere; }
.item a.title:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.item a.title::after { content: ""; position: absolute; inset: 0; }  /* 行のどこを押しても記事を開く */
.item.read a.title { color: var(--read); font-weight: 500; }
.desc { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 72ch; }
.thumb { flex: none; width: 132px; height: 80px; border-radius: 6px; object-fit: cover; background: var(--chip); }
.item.read .thumb { opacity: .6; }
.empty, .notice { color: var(--muted); padding: 40px 0; text-align: center; }
.empty button { margin-top: 12px; }
.notice code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
.errors { font-size: 12px; color: var(--muted); padding: 16px 0; }
.more { display: block; margin: 20px auto; padding: 8px 20px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; }
.to-top { position: fixed; right: 20px; bottom: 24px; z-index: 15; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); box-shadow: 0 2px 10px rgba(0,0,0,.15); cursor: pointer; display: grid; place-items: center;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top svg { width: 18px; height: 18px; }

/* ---- SNS（右 1/4） ---- */
#sns { position: sticky; top: var(--hdr, 120px); height: calc(100vh - var(--hdr, 120px)); display: flex; flex-direction: column;
  border-left: 1px solid var(--line); padding-left: 18px; }
.sns-head { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; }
.sns-head b { font-size: 15px; }
.sns-head .via { font-size: 12px; color: var(--muted); }
.sns-head button { border: 1px solid var(--line); background: var(--surface); font-size: 13px; border-radius: 8px; padding: 3px 10px; cursor: pointer; }
.sns-head #snsReload { margin-left: auto; }
.sns-close { display: none; }
.sns-tags { font-size: 12px; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
#snsList { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }
.post { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.post:hover .ptext { color: var(--text); }
.phead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--chip); flex: none; }
.pname { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.phandle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ptime { flex: none; }
.ptext { font-size: 13.5px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ptext a { color: var(--accent); text-decoration: none; }
.ptext a:hover { text-decoration: underline; }
.pimg { display: block; width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: var(--chip); }
.pcard { display: flex; gap: 8px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  color: var(--text); text-decoration: none; font-size: 12px; background: var(--surface); }
.pcard img { width: 64px; height: 64px; object-fit: cover; flex: none; }
.pcard div { padding: 6px 8px 6px 0; min-width: 0; }
.pcard b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
.pcard small { color: var(--muted); }
.pfoot { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; }
.sns-note { font-size: 12px; color: var(--muted); padding: 24px 0; text-align: center; }

/* ---- 日程・配信 ---- */
.sch-intro { font-size: 12px; color: var(--muted); padding: 14px 0 4px; }
.bc-box { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 10px; padding: 12px 16px; margin: 10px 0 6px; }
.bc-box h3 { margin: 0 0 8px; font-size: 14px; }
.bc-box ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bc-box li { font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bc-box li a { color: var(--text); font-weight: 600; }
.bc-box li b { font-weight: 600; }
.bc-box li span { color: var(--muted); font-size: 12px; }
.kind { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.month { font-family: var(--num); font-size: 15px; font-weight: 700; color: var(--muted); padding: 20px 0 6px; border-bottom: 2px solid var(--line); }
.ev { position: relative; display: flex; gap: 14px; padding: 14px 0 14px 16px; border-bottom: 1px solid var(--line); }
.ev::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 2px; background: var(--c); }
.ev.next { background: var(--surface); margin: 8px 0; padding: 16px 16px 16px 20px; border-radius: 10px; border: 1px solid var(--line); }
.ev.next::before { left: 0; top: -1px; bottom: -1px; width: 6px; border-radius: 10px 0 0 10px; }
.ev-date { flex: none; width: 70px; text-align: center; line-height: 1.25; }
.ev-date b { display: block; font-family: var(--num); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ev-date small { color: var(--muted); font-size: 12px; }
.ev-date span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-family: var(--num); }
.ev-body { flex: 1; min-width: 0; }
.ev-name { font-weight: 700; font-size: 17px; margin: 3px 0 1px; }
.ev-venue { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; }
.badge.live { background: var(--accent); color: #fff; }
.badge.soon { color: var(--accent); }
.badge.prov { color: var(--muted); border: 1px solid var(--line); }
.sessions { display: flex; flex-wrap: wrap; gap: 5px 6px; margin-top: 9px; }
.ses { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 3px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ses b { margin-right: 5px; }
.ses.race { background: var(--c); color: #fff; }
.ses.past { opacity: .45; }
.ses-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bc-chips { display: flex; flex-wrap: wrap; gap: 5px 6px; margin-top: 9px; align-items: center; font-size: 12px; }
.bc-chips > span:first-child { color: var(--muted); margin-right: 2px; }
.bc-chips a, .bc-chips em { font-style: normal; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  text-decoration: none; background: var(--surface); }
.bc-chips a:hover { border-color: var(--text); }
.sch-foot { font-size: 12px; color: var(--muted); padding: 24px 0; line-height: 1.8; }
.sch-foot a { color: var(--muted); }

/* スマホ用の下のタブバー */
.bottom-nav { display: none; }

@media (max-width: 899px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .seg.view { display: none; }
  #sns { display: none; }
  body.sns-open { overflow: hidden; }
  body.sns-open #sns { display: flex; position: fixed; inset: 0 0 calc(60px + env(safe-area-inset-bottom)); height: auto; z-index: 20;
    background: var(--bg); border-left: 0; padding: 0 16px; }
  .sns-close { display: inline-block; }
  main { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .bottom-nav { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottom-nav button { border: 0; background: none; padding: 7px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; color: var(--muted); cursor: pointer; }
  .bottom-nav button svg { width: 22px; height: 22px; }
  .bottom-nav button.on { color: var(--accent); font-weight: 600; }
  .to-top { bottom: calc(76px + env(safe-area-inset-bottom)); right: 14px; }
  .msg { bottom: calc(76px + env(safe-area-inset-bottom)); }
  /* 絞り込みは下から出るシートにする */
  body.filters-open .filters { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface);
    border-radius: 16px 16px 0 0; border-top: 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 30px rgba(0,0,0,.25); flex-direction: column; align-items: stretch; }
  body.filters-open .sheet-backdrop { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); }
  body.filters-open header { z-index: 36; }  /* シートはヘッダーの中にあるので、ヘッダーごと前に出す */
  .field.search { flex: none; }
  .filters .actions { margin-left: 0; }
  .filters .actions button { flex: 1; padding: 10px; }
  .filter-btn .label { display: none; }
}
@media (max-width: 560px) {
  .top { gap: 10px; }
  .logo { font-size: 19px; }
  .thumb { width: 88px; height: 60px; }
  .desc { display: none; }
  .item a.title { font-size: 16px; }
  .next-board { grid-template-columns: 1fr auto; padding: 12px 14px; gap: 2px 12px; }
  .nb-name { font-size: 17px; }
  .nb-label, .nb-when { grid-column: 1; }
  .nb-count { grid-column: 2; }
  .nb-count b { font-size: 26px; }
  .ev-date { width: 54px; }
  .ev-date b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 class="logo"><span class="kerb" aria-hidden="true"></span>Motorsport RSS</h1>
    <div class="seg view" id="view" role="tablist" aria-label="画面"><button data-v="news">ニュース</button><button data-v="schedule">日程・配信</button></div>
    <div class="status"><span class="updated" id="updated"></span><button id="refresh" class="refresh" title="最新の記事を読み込む">更新</button></div>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div class="navrow">
    <nav id="tabs" aria-label="カテゴリー"></nav>
    <button id="filterBtn" class="filter-btn" aria-expanded="false" aria-controls="filters" title="絞り込み・検索（/ キー）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="label">絞り込み</span><span id="filterCount" class="count" hidden></span>
    </button>
  </div>
  <div class="filters" id="filters" role="dialog" aria-label="絞り込み・検索">
    <label class="field search"><span>キーワード</span><input type="search" id="q" placeholder="ドライバー・チーム・サーキット名など"></label>
    <div class="field"><span>言語</span>
      <div class="seg" id="lang"><button data-v="all" class="on">すべて</button><button data-v="ja">日本語</button><button data-v="en">English</button></div>
    </div>
    <label class="field"><span>サイト</span><select id="source"></select></label>
    <label class="chk"><input type="checkbox" id="hideRead"> 既読を隠す</label>
    <div class="actions">
      <button id="markAll" class="ghost" title="いま表示している記事をすべて既読にする">すべて既読にする</button>
      <button id="filterDone" class="ghost primary">閉じる</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="sheet-backdrop" id="backdrop"></div>
<div class="layout">
  <main id="list"></main>
  <aside id="sns" aria-label="SNS の投稿">
    <div class="sns-head">
      <b>SNS</b><span class="via">Bluesky の公式・記者アカウント</span>
      <button id="snsReload" title="SNS を再読み込み">↻</button>
      <button id="snsClose" class="sns-close" title="閉じる">閉じる</button>
    </div>
    <div class="sns-tags" id="snsTags"></div>
    <div id="snsList"></div>
  </aside>
</div>
<button id="toTop" class="to-top" title="いちばん上へ" aria-label="いちばん上へ">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg>
</button>
<nav class="bottom-nav" id="bottomNav" aria-label="画面の切り替え">
  <button data-v="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h6M7 12h10M7 16h10"/></svg>ニュース</button>
  <button data-v="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>日程</button>
  <button data-v="sns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>SNS</button>
</nav>

<script src="data.js"></script>
<script src="schedule.js"></script>
<script>
const CATS = [
  { id: "all", label: "すべて" },
  { id: "f1", label: "F1", re: /\bF1\b|Formula ?1|Formula One|フォーミュラ1|グランプリ|Grand Prix/i },
  { id: "supergt", label: "スーパーGT", re: /スーパーGT|SUPER ?GT/i },
  { id: "superformula", label: "スーパーフォーミュラ", re: /スーパーフォーミュラ|Super ?Formula/i },
  { id: "motogp", label: "MotoGP・二輪", re: /MotoGP|Moto2|Moto3|WSBK|WorldSBK|スーパーバイク|8耐|鈴鹿8時間/i },
  { id: "wec", label: "WEC・耐久", re: /\bWEC\b|ル・マン|Le ?Mans|IMSA|耐久|Endurance|Daytona|Hypercar|ハイパーカー|スーパー耐久/i },
  { id: "wrc", label: "WRC・ラリー", re: /\bWRC\b|ラリー|Rally|ダカール|Dakar/i },
  { id: "indy", label: "インディ・NASCAR", re: /IndyCar|インディ|Indy ?500|NASCAR/i },
  { id: "fe", label: "フォーミュラE", re: /Formula ?E\b|フォーミュラE/i },
  { id: "other", label: "その他" },
];
const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.label]));
// 自動分類で F1 と誤判定しやすいので、二輪などを先に判定し F1 は最後に見る
const AUTO_ORDER = ["supergt", "superformula", "fe", "motogp", "wec", "wrc", "indy", "f1"];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  view: store.get("msr.view", "news"),
  cat: store.get("msr.cat", "all"), lang: store.get("msr.lang", "all"), source: "all", q: "",
  hideRead: store.get("msr.hideRead", false), limit: 60,
};
const readSet = new Set(store.get("msr.read", []));
// 前回ページを離れた時刻。これより新しい未読の記事に「新着」を付ける
const prevVisit = store.get("msr.lastVisit", 0) ? new Date(store.get("msr.lastVisit", 0)) : null;
document.addEventListener("visibilitychange", () => { if (document.hidden) store.set("msr.lastVisit", Date.now()); });
window.addEventListener("pagehide", () => store.set("msr.lastVisit", Date.now()));

const $ = id => document.getElementById(id);
const textOf = html => {
  if (!html) return "";
  const d = new DOMParser().parseFromString(html, "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();
};
const firstImg = html => {
  const m = html && html.match(/<img[^>]+src=["']([^"']+)/i);
  return m ? m[1] : "";
};
const decode = b64 => new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

function child(el, ...names) {
  for (const n of names) {
    for (const c of el.children) if (c.localName === n || c.nodeName === n) return c;
  }
  return null;
}

function parseFeed(feed) {
  const doc = new DOMParser().parseFromString(decode(feed.b64), "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML parse error");
  const nodes = [...doc.getElementsByTagName("item"), ...doc.getElementsByTagName("entry")];
  return nodes.map(n => {
    const title = textOf(child(n, "title")?.textContent || "");
    const linkEl = child(n, "link");
    const link = (linkEl?.getAttribute("href") || linkEl?.textContent || "").trim();
    const dateStr = child(n, "pubDate", "published", "updated", "dc:date")?.textContent;
    const rawDesc = child(n, "description", "summary")?.textContent || "";
    const content = child(n, "content:encoded", "encoded", "content")?.textContent || "";
    const tags = [...n.getElementsByTagName("category")].map(c => c.textContent || c.getAttribute("term") || "");
    const enc = child(n, "enclosure");
    const media = n.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "content")[0]
      || n.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "thumbnail")[0];
    let img = (enc && /image/.test(enc.getAttribute("type") || "image") && enc.getAttribute("url"))
      || media?.getAttribute("url") || firstImg(rawDesc) || firstImg(content) || "";
    const desc = textOf(rawDesc).slice(0, 220);
    const date = dateStr ? new Date(dateStr.trim()) : null;

    let cats;
    if (feed.cat.startsWith("auto")) {
      const hay = title + " " + tags.join(" ");
      const hit = AUTO_ORDER.filter(id => CATS.find(c => c.id === id).re.test(hay));
      // F1 は他カテゴリに当たったら除外（「MotoGP グランプリ」などの誤判定対策）。ただしタイトルに「F1」とあれば残す
      cats = hit.length > 1 && !/\bF1\b/.test(title) ? hit.filter(c => c !== "f1") : hit;
      if (!cats.length) cats = [feed.cat.split(":")[1] || "other"];  // "auto:f1" なら F1 に入れる
    } else cats = [feed.cat];

    return { title, link, date: date && !isNaN(date) ? date : null, desc, img, cats,
      source: feed.name, lang: feed.lang };
  }).filter(i => i.title && i.link);
}

const errors = [];
let items = [];
function load() {
  const data = window.FEED_DATA;
  if (!data) return false;
  errors.length = 0;
  const seen = new Map();
  for (const f of data.feeds) {
    if (!f.ok) { errors.push(`${f.name}（${f.cat}）: HTTP ${f.status}`); continue; }
    try {
      for (const it of parseFeed(f)) {
        const key = it.link.split("?")[0];
        const prev = seen.get(key);
        if (prev) { prev.cats = [...new Set([...prev.cats, ...it.cats])]; continue; }
        seen.set(key, it);
      }
    } catch (e) { errors.push(`${f.name}（${f.cat}）: ${e.message}`); }
  }
  items = [...seen.values()].sort((a, b) => (b.date || 0) - (a.date || 0));
  updateLabel();
  return true;
}

function updateLabel() {
  const gen = new Date(window.FEED_DATA.generated);
  const ageMin = (Date.now() - gen) / 60000;
  const el = $("updated");
  const a = ago(gen);
  el.textContent = a === "たった今" ? "たった今更新" : `${a}に更新`;
  el.title = `記事の取得: ${gen.toLocaleString("ja-JP")}`
    + (ageMin > 60 && location.protocol === "file:" ? "\n「更新して開く.command」で最新にできます" : "");
  el.classList.toggle("stale", ageMin > 60);
}

function ago(d) {
  if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}時間前`;
  return `${Math.round(h / 24)}日前`;
}

function baseFiltered() {
  const q = state.q.toLowerCase();
  return items.filter(i =>
    (state.lang === "all" || i.lang === state.lang) &&
    (state.source === "all" || i.source === state.source) &&
    (!state.hideRead || !readSet.has(i.link)) &&
    (!q || (i.title + " " + i.desc).toLowerCase().includes(q)));
}

function renderTabs(base) {
  const counts = {};
  for (const i of base) for (const c of i.cats) counts[c] = (counts[c] || 0) + 1;
  drawTabs(counts, base.length);
}

function drawTabs(counts, total) {
  $("tabs").innerHTML = "";
  for (const c of CATS) {
    if (c.id === "other" && state.view === "schedule") continue;  // 日程に「その他」はない
    const n = c.id === "all" ? total : (counts[c.id] || 0);
    const b = document.createElement("button");
    b.className = c.id === state.cat ? "on" : "";
    b.dataset.cat = c.id;
    b.setAttribute("aria-pressed", c.id === state.cat);
    b.innerHTML = `<i></i>${c.label}<small>${n}</small>`;
    b.onclick = () => { state.cat = c.id; state.limit = 60; store.set("msr.cat", c.id); render(); window.scrollTo(0, 0); };
    $("tabs").appendChild(b);
  }
  // 選んでいるタブが見えるように横にスクロールする
  const on = $("tabs").querySelector(".on");
  if (on) {
    const t = $("tabs"), l = on.offsetLeft - t.offsetLeft;
    if (l < t.scrollLeft || l + on.offsetWidth > t.scrollLeft + t.clientWidth - 28) t.scrollLeft = l - 40;
  }
}

// ---- 絞り込み（パネル・チップ） ----
function activeFilters() {
  const f = [];
  if (state.q) f.push({ label: `「${state.q}」`, clear: () => { state.q = ""; $("q").value = ""; } });
  if (state.lang !== "all") f.push({ label: state.lang === "ja" ? "日本語" : "English", clear: () => setLang("all") });
  if (state.source !== "all") f.push({ label: state.source, clear: () => { state.source = "all"; $("source").value = "all"; } });
  if (state.hideRead) f.push({ label: "既読を隠す", clear: () => { state.hideRead = false; $("hideRead").checked = false; store.set("msr.hideRead", false); } });
  return f;
}

function renderChips() {
  const f = activeFilters();
  $("filterCount").hidden = !f.length;
  $("filterCount").textContent = f.length;
  const box = $("chips");
  box.innerHTML = "";
  for (const x of f) {
    const c = document.createElement("button");
    c.className = "chip"; c.title = "この条件を外す";
    c.append(x.label);
    const s = document.createElement("span"); s.textContent = "×"; s.setAttribute("aria-hidden", "true");
    c.appendChild(s);
    c.onclick = () => { x.clear(); state.limit = 60; renderSources(); render(); };
    box.appendChild(c);
  }
  if (f.length > 1) {
    const c = document.createElement("button");
    c.className = "chip clear"; c.textContent = "すべて外す";
    c.onclick = clearFilters;
    box.appendChild(c);
  }
}

function clearFilters() {
  for (const x of activeFilters()) x.clear();
  state.limit = 60; renderSources(); render();
}

function setLang(v) {
  state.lang = v; store.set("msr.lang", v);
  for (const x of $("lang").children) x.classList.toggle("on", x.dataset.v === v);
}

function openFilters(open, focusSearch) {
  document.body.classList.toggle("filters-open", open);
  $("filterBtn").setAttribute("aria-expanded", open);
  if (open && focusSearch) setTimeout(() => $("q").focus(), 0);
}

// ---- 次のレース（ニュース画面の上のカウントダウン） ----
function nextRace() {
  const now = Date.now();
  const events = scheduleEvents().filter(e => state.cat === "all" || e.series === state.cat);
  for (const e of events) {
    const sessions = (e.sessions || []).map(s => ({ ...s, t: new Date(s.time).getTime() }));
    if (sessions.length) {
      const race = sessions.filter(s => s.name === "決勝").pop() || sessions[sessions.length - 1];
      if (race.t + 3 * 3600000 < now) continue;  // 決勝が終わったイベントは飛ばす
      const next = sessions.find(s => s.t + 3600000 > now) || race;  // 走行中のセッションも「次」に含める
      return { e, race, next };
    }
    return { e };
  }
  return null;
}

function countdownText(t) {
  const ms = t - Date.now();
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), sec = s % 60, p = n => String(n).padStart(2, "0");
  return d ? `${d}日 ${p(h)}:${p(m)}:${p(sec)}` : `${p(h)}:${p(m)}:${p(sec)}`;
}

function renderNextBoard() {
  const n = nextRace();
  if (!n) return null;
  const { e, race, next } = n;
  const a = document.createElement("a");
  a.className = "next-board"; a.dataset.cat = e.series; a.href = "#schedule";
  a.title = "日程・配信を見る";
  a.onclick = ev => { ev.preventDefault(); setView("schedule"); };
  const label = document.createElement("div"); label.className = "nb-label";
  const tag = document.createElement("span"); tag.className = "tag"; tag.dataset.cat = e.series; tag.textContent = SERIES_LABEL[e.series];
  label.append("次のレース", tag);
  if (e.round) label.append(e.round);
  const name = document.createElement("div"); name.className = "nb-name"; name.textContent = e.name;
  const when = document.createElement("div"); when.className = "nb-when";
  const cd = document.createElement("div"); cd.className = "nb-count";
  const small = document.createElement("small"), big = document.createElement("b");
  if (race) {
    when.textContent = `決勝 ${fmtSession.format(new Date(race.t))}（日本時間）`;
    big.dataset.t = next.t;
    small.textContent = next.t > Date.now() ? `${next.name}まで` : `${next.name}`;
  } else {
    const s = dayParts(e.start);
    when.textContent = `${s.md}(${s.wd}) 開幕${e.venue ? `　${e.venue}` : ""}`;
    big.dataset.t = new Date(e.start + "T00:00:00+09:00").getTime();
    small.textContent = "開幕まで";
  }
  cd.append(small, big);
  a.append(label, name, when, cd);
  tickNextBoard(big);
  return a;
}

function tickNextBoard(el) {
  el = el || document.querySelector(".nb-count b");
  if (!el) return;
  const txt = countdownText(Number(el.dataset.t));
  el.textContent = txt || "走行中";
  el.classList.toggle("live", !txt);
}
setInterval(() => tickNextBoard(), 1000);

function renderSources() {
  const names = [...new Set(items.filter(i => state.lang === "all" || i.lang === state.lang).map(i => i.source))].sort();
  if (state.source !== "all" && !names.includes(state.source)) state.source = "all";
  $("source").innerHTML = `<option value="all">すべてのサイト</option>` +
    names.map(n => `<option${n === state.source ? " selected" : ""}></option>`).join("");
  [...$("source").options].slice(1).forEach((o, k) => { o.value = o.textContent = names[k]; });
  $("source").value = state.source;
}

let moreObserver = null;
function render() {
  if (moreObserver) { moreObserver.disconnect(); moreObserver = null; }
  maybeLoadSns();
  document.body.classList.toggle("view-schedule", state.view === "schedule");
  for (const b of $("view").children) b.classList.toggle("on", b.dataset.v === state.view);
  const snsOpen = document.body.classList.contains("sns-open");
  for (const b of $("bottomNav").children) b.classList.toggle("on", snsOpen ? b.dataset.v === "sns" : b.dataset.v === state.view);
  if (state.view === "schedule") { renderSchedule(); return; }
  renderChips();
  const base = baseFiltered();
  renderTabs(base);
  const list = state.cat === "all" ? base : base.filter(i => i.cats.includes(state.cat));
  const main = $("list");
  main.innerHTML = "";
  const board = renderNextBoard();
  if (board) main.appendChild(board);
  if (!list.length) {
    const empty = document.createElement("div"); empty.className = "empty";
    if (activeFilters().length) {
      empty.append("この条件に合う記事はありません。");
      const b = document.createElement("button"); b.className = "ghost"; b.textContent = "絞り込みをすべて外す";
      b.onclick = clearFilters;
      empty.append(document.createElement("br"), b);
    } else empty.textContent = items.length ? "このカテゴリーの記事はまだありません。" : "記事を読み込んでいます…";
    main.appendChild(empty);
  }
  for (const i of list.slice(0, state.limit)) {
    const row = document.createElement("article");
    row.className = "item" + (readSet.has(i.link) ? " read" : "");
    row.dataset.cat = (state.cat !== "all" && i.cats.includes(state.cat)) ? state.cat : i.cats[0];
    const body = document.createElement("div");
    body.className = "body";
    const meta = document.createElement("div");
    meta.className = "meta";
    const src = document.createElement("span"); src.className = "src"; src.textContent = i.source; meta.appendChild(src);
    if (state.cat === "all" || i.cats.length > 1)
      for (const c of i.cats) { const t = document.createElement("span"); t.className = "tag"; t.dataset.cat = c; t.textContent = CAT_LABEL[c]; meta.appendChild(t); }
    const tm = document.createElement("span"); tm.textContent = ago(i.date);
    if (i.date) tm.title = i.date.toLocaleString("ja-JP");
    meta.appendChild(tm);
    if (prevVisit && i.date && i.date > prevVisit && !readSet.has(i.link)) {
      const nw = document.createElement("span"); nw.className = "new"; nw.textContent = "新着"; meta.appendChild(nw);
    }
    const a = document.createElement("a");
    a.className = "title"; a.href = i.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = i.title;
    a.onclick = () => { readSet.add(i.link); store.set("msr.read", [...readSet].slice(-3000)); row.classList.add("read"); };
    const d = document.createElement("div"); d.className = "desc"; d.textContent = i.desc;
    body.append(meta, a, d);
    row.appendChild(body);
    if (i.img && /^https?:/.test(i.img)) {
      const img = document.createElement("img");
      img.className = "thumb"; img.loading = "lazy"; img.src = i.img; img.alt = ""; img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();
      row.appendChild(img);
    }
    main.appendChild(row);
  }
  if (list.length > state.limit) {
    const m = document.createElement("button");
    m.className = "more"; m.textContent = `さらに表示（残り ${list.length - state.limit} 件）`;
    m.onclick = () => { state.limit += 60; render(); };
    main.appendChild(m);
    // 下までスクロールしたら自動で続きを出す
    if ("IntersectionObserver" in window) {
      moreObserver = new IntersectionObserver(es => {
        if (es[0].isIntersecting) { moreObserver.disconnect(); state.limit += 60; render(); }
      }, { rootMargin: "600px" });
      moreObserver.observe(m);
    }
  }
  if (errors.length) {
    const e = document.createElement("div");
    e.className = "errors"; e.textContent = "取得できなかったフィード: " + errors.join(" / ");
    main.appendChild(e);
  }
}

// ---- 日程・配信（schedule.js。F1 と MotoGP はセッション時刻つき） ----
const SERIES_LABEL = { f1: "F1", supergt: "スーパーGT", superformula: "スーパーフォーミュラ", motogp: "MotoGP",
  wec: "WEC", wrc: "WRC", indy: "インディカー", fe: "フォーミュラE" };
const JST = "Asia/Tokyo";
const fmtSession = new Intl.DateTimeFormat("ja-JP", { timeZone: JST, month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmtYmd = new Intl.DateTimeFormat("en-CA", { timeZone: JST, year: "numeric", month: "2-digit", day: "2-digit" });
const todayJST = () => fmtYmd.format(new Date());
// "2027-03-07" → { md: "3/7", wd: "日" }（日付だけのデータなので UTC の正午で曜日を出す）
function dayParts(ymd) {
  const d = new Date(ymd + "T12:00:00Z");
  return { md: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`, wd: "日月火水木金土"[d.getUTCDay()] };
}
function daysUntil(ymd) {
  return Math.round((new Date(ymd + "T00:00:00Z") - new Date(todayJST() + "T00:00:00Z")) / 86400000);
}

function scheduleEvents() {
  const d = window.SCHEDULE_DATA;
  if (!d) return [];
  const today = todayJST();
  return d.events.filter(e => e.end >= today);
}

function broadcastLinks(list, withDetail) {
  return (list || []).map(b => {
    const el = document.createElement(b.url ? "a" : "em");
    if (b.url) { el.href = b.url; el.target = "_blank"; el.rel = "noopener"; }
    el.textContent = b.name;
    el.title = [b.kind, b.detail].filter(Boolean).join("、");
    if (!withDetail) return el;
    const li = document.createElement("li");
    const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = b.kind || "";
    const name = document.createElement(b.url ? "a" : "b");
    if (b.url) { name.href = b.url; name.target = "_blank"; name.rel = "noopener"; }
    name.textContent = b.name;
    const detail = document.createElement("span"); detail.textContent = b.detail || "";
    li.append(kind, name, detail);
    return li;
  });
}

function renderSchedule() {
  const data = window.SCHEDULE_DATA;
  const all = scheduleEvents();
  const counts = {};
  for (const e of all) counts[e.series] = (counts[e.series] || 0) + 1;
  drawTabs(counts, all.length);

  const main = $("list");
  main.innerHTML = "";
  if (!data) {
    main.innerHTML = `<div class="notice">日程データがありません。ターミナルで <code>./fetch.sh</code> を実行してください。</div>`;
    return;
  }
  const list = state.cat === "all" ? all : all.filter(e => e.series === state.cat);
  const intro = document.createElement("div");
  intro.className = "sch-intro";
  intro.textContent = "時刻はすべて日本時間です。F1・MotoGP はセッションごとの時刻を表示しています。";
  main.appendChild(intro);

  // カテゴリーを選んでいるときは、そのシリーズの配信先を詳しく出す
  const bcs = data.broadcasts[state.cat];
  if (bcs) {
    const box = document.createElement("div"); box.className = "bc-box"; box.dataset.cat = state.cat;
    const h = document.createElement("h3"); h.textContent = `${SERIES_LABEL[state.cat]} の日本での視聴方法`;
    const ul = document.createElement("ul"); ul.append(...broadcastLinks(bcs, true));
    box.append(h, ul);
    main.appendChild(box);
  }

  if (!list.length) {
    main.insertAdjacentHTML("beforeend", `<div class="empty">このカテゴリーの今後の日程はまだ発表されていません</div>`);
  }
  const now = Date.now(), today = todayJST();
  let month = "", markedNext = false;
  for (const e of list) {
    const m = e.start.slice(0, 7);
    if (m !== month) {
      month = m;
      const h = document.createElement("div"); h.className = "month";
      h.textContent = `${m.slice(0, 4)}年${Number(m.slice(5))}月`;
      main.appendChild(h);
    }
    const ev = document.createElement("article");
    ev.className = "ev";
    ev.dataset.cat = e.series;
    if (!markedNext) { ev.classList.add("next"); markedNext = true; }

    const s = dayParts(e.start), en = dayParts(e.end);
    const date = document.createElement("div"); date.className = "ev-date";
    date.innerHTML = `<b></b><small></small>`;
    date.querySelector("b").textContent = s.md;
    date.querySelector("small").textContent = `(${s.wd})`;
    if (e.end !== e.start) { const t = document.createElement("span"); t.textContent = `〜${en.md}(${en.wd})`; date.appendChild(t); }

    const body = document.createElement("div"); body.className = "ev-body";
    const meta = document.createElement("div"); meta.className = "meta";
    const tag = document.createElement("span"); tag.className = "tag"; tag.dataset.cat = e.series; tag.textContent = SERIES_LABEL[e.series] || e.series;
    meta.appendChild(tag);
    if (e.round) meta.append(e.round);
    const badge = document.createElement("span"); badge.className = "badge";
    const d = daysUntil(e.start);
    if (e.start <= today && today <= e.end) { badge.classList.add("live"); badge.textContent = "開催中"; }
    else if (d === 1) { badge.classList.add("soon"); badge.textContent = "明日から"; }
    else if (d <= 14) { badge.classList.add("soon"); badge.textContent = `あと ${d} 日`; }
    if (badge.textContent) meta.appendChild(badge);
    if (e.provisional) { const p = document.createElement("span"); p.className = "badge prov"; p.textContent = "暫定"; meta.appendChild(p); }

    const name = document.createElement("div"); name.className = "ev-name"; name.textContent = e.name;
    const venue = document.createElement("div"); venue.className = "ev-venue";
    for (const v of [e.venue, e.note].filter(Boolean)) { const sp = document.createElement("span"); sp.textContent = v; venue.appendChild(sp); }
    body.append(meta, name, venue);

    if (e.sessions && e.sessions.length) {
      const ss = document.createElement("div"); ss.className = "sessions";
      for (const x of e.sessions) {
        const t = new Date(x.time);
        const el = document.createElement("span");
        el.className = "ses" + (x.name === "決勝" ? " race" : "") + (t.getTime() + 2 * 3600000 < now ? " past" : "");
        const b = document.createElement("b"); b.textContent = x.name;
        el.append(b, fmtSession.format(t));
        ss.appendChild(el);
      }
      body.appendChild(ss);
    } else {
      const n = document.createElement("div"); n.className = "ses-note";
      n.textContent = "セッションの時刻は未発表です。";
      body.appendChild(n);
    }

    const chips = document.createElement("div"); chips.className = "bc-chips";
    const label = document.createElement("span"); label.textContent = "配信";
    chips.append(label, ...broadcastLinks(data.broadcasts[e.series], false));
    body.appendChild(chips);

    ev.append(date, body);
    main.appendChild(ev);
  }

  const foot = document.createElement("div"); foot.className = "sch-foot";
  const gen = new Date(data.generated);
  foot.append(`${data.broadcastNote} F1・MotoGP の日程は ${gen.toLocaleString("ja-JP", { timeZone: JST })} に自動取得、それ以外のシリーズは ${data.manualUpdated} 時点の発表をもとにしています。「暫定」は主催者が予定として発表した日程です。`);
  foot.appendChild(document.createElement("br"));
  foot.append("出典: ");
  data.sources.forEach((src, i) => {
    const a = document.createElement("a"); a.href = src.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = src.label;
    if (i) foot.append(" / ");
    foot.appendChild(a);
  });
  main.appendChild(foot);
}

// ---- SNS（Bluesky の公式・記者アカウントの投稿。ブラウザから直接取得できる） ----
// cat: そのアカウントのカテゴリー。auto: true は複数シリーズを扱うので投稿ごとにキーワードで振り分け、
// どれにも当たらなければ cat に入れる
const SNS_ACCOUNTS = [
  { handle: "andrewbensonf1.bsky.social", note: "BBC Sport", cat: "f1" },
  { handle: "chrismedlandf1.bsky.social", note: "F1 記者", cat: "f1" },
  { handle: "rorymitchellf1.bsky.social", note: "F1 記者", cat: "f1" },
  { handle: "thomasmaheronf1.bsky.social", note: "PlanetF1 記者", cat: "f1" },
  { handle: "joesaward.bsky.social", note: "F1 記者", cat: "f1" },
  { handle: "adamcooperf1.bsky.social", note: "F1 記者", cat: "f1" },
  { handle: "planetf1com.bsky.social", note: "PlanetF1", cat: "f1" },
  { handle: "f1oversteer.com", note: "F1 Oversteer", cat: "f1" },
  { handle: "formula1-data.bsky.social", note: "Formula1-Data", cat: "f1", auto: true, lang: "ja" },
  { handle: "motomatters.com", note: "MotoMatters", cat: "motogp" },
  { handle: "neilmorrison87.bsky.social", note: "MotoGP 記者", cat: "motogp" },
  { handle: "denkmit.bsky.social", note: "MotoGP 記者", cat: "motogp" },
  { handle: "dailysportscar.bsky.social", note: "dailysportscar", cat: "wec" },
  { handle: "marshallpruett.bsky.social", note: "RACER 記者", cat: "indy", auto: true },
  { handle: "rjoconnell.bsky.social", note: "モータースポーツ記者", cat: "other", auto: true },
  { handle: "racefans.net", note: "RaceFans", cat: "f1", auto: true },
];
const BSKY_FEED = "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed";
// 成人向け・暴力的・スパムのラベルが付いた投稿は表示しない
const BLOCKED_LABELS = new Set(["porn", "sexual", "sexual-figurative", "nudity", "graphic-media", "gore", "spam", "!hide", "!warn"]);
const accountCache = new Map();  // handle -> { t, posts: [{ post, cats }] }
let snsSeq = 0, snsKey = "";

function snsVisible() {
  return getComputedStyle($("sns")).display !== "none";
}

function maybeLoadSns() {
  const key = state.cat + "|" + state.lang;
  if (key !== snsKey) loadSns(false);
}

function classifyText(text) {
  const hits = AUTO_ORDER.filter(id => CATS.find(c => c.id === id).re.test(text));
  return hits.length > 1 ? hits.filter(c => c !== "f1") : hits;
}

async function fetchAccount(acc) {
  const p = new URLSearchParams({ actor: acc.handle, limit: 30, filter: "posts_no_replies" });
  const r = await fetch(`${BSKY_FEED}?${p}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const posts = ((await r.json()).feed || [])
    .filter(item => !item.reason)  // リポストは除き、本人の投稿だけにする
    .map(item => item.post)
    .filter(p => ![...(p.labels || []), ...(p.author?.labels || [])].some(l => BLOCKED_LABELS.has(l.val)))
    .map(post => {
      let cats = [acc.cat];
      if (acc.auto) {
        const hit = classifyText((post.record?.text || "") + " " + (post.embed?.external?.title || ""));
        if (hit.length) cats = hit;
      }
      return { post, cats, lang: acc.lang || "en" };
    });
  accountCache.set(acc.handle, { t: Date.now(), posts });
}

async function loadSns(force) {
  const key = snsKey = state.cat + "|" + state.lang;
  const cat = state.cat;
  const accounts = cat === "all" ? SNS_ACCOUNTS : SNS_ACCOUNTS.filter(a => a.auto || a.cat === cat);
  const named = cat === "all" ? SNS_ACCOUNTS : accounts.filter(a => a.cat === cat);
  $("snsTags").textContent = cat === "all" || cat === "other"
    ? `公式・記者 ${SNS_ACCOUNTS.length} アカウント`
    : named.length ? named.map(a => a.note).filter((v, i, s) => s.indexOf(v) === i).join("・") + " ほか" : "複数シリーズを扱うアカウントから";
  if (state.lang !== "all") $("snsTags").append(`（${state.lang === "ja" ? "日本語" : "English"}）`);

  const stale = accounts.filter(a => force || !accountCache.has(a.handle) || Date.now() - accountCache.get(a.handle).t > 120000);
  if (!stale.length) { renderSns(collectPosts(accounts)); return; }
  const hasAny = accounts.some(a => accountCache.has(a.handle));
  if (hasAny) renderSns(collectPosts(accounts));
  else $("snsList").innerHTML = `<div class="sns-note">読み込み中…</div>`;
  if (!snsVisible() && !force) return;  // スマホでパネルを閉じているときは取りに行かない

  const seq = ++snsSeq;
  const results = await Promise.allSettled(stale.map(fetchAccount));
  if (seq !== snsSeq || key !== snsKey) return;  // 途中でカテゴリーが切り替わった
  if (!results.some(r => r.status === "fulfilled") && !hasAny) {
    $("snsList").innerHTML = `<div class="sns-note">Bluesky に接続できませんでした。↻ で再試行してください。</div>`;
    return;
  }
  renderSns(collectPosts(accounts));
}

function collectPosts(accounts) {
  const cat = state.cat, lang = state.lang;
  return accounts.flatMap(a => accountCache.get(a.handle)?.posts || [])
    .filter(x => cat === "all" || x.cats.includes(cat))
    .filter(x => {
      if (lang === "all") return true;
      const l = x.post.record?.langs;
      return l && l.length ? l.some(v => v.startsWith(lang)) : x.lang === lang;
    })
    .map(x => x.post)
    .sort((a, b) => new Date(b.indexedAt) - new Date(a.indexedAt))
    .slice(0, 60);
}

// 本文中のリンク・ハッシュタグ・メンションを facets（UTF-8 のバイト位置）から復元する
function richText(record) {
  const frag = document.createDocumentFragment();
  const text = record.text || "";
  const facets = (record.facets || []).slice().sort((a, b) => a.index.byteStart - b.index.byteStart);
  try {
    const bytes = new TextEncoder().encode(text), dec = new TextDecoder();
    let pos = 0;
    for (const f of facets) {
      const { byteStart: s, byteEnd: e } = f.index;
      if (s < pos || e > bytes.length || s >= e) continue;
      frag.append(dec.decode(bytes.slice(pos, s)));
      const feat = f.features?.[0] || {};
      const label = dec.decode(bytes.slice(s, e));
      let href = null;
      if (feat.$type === "app.bsky.richtext.facet#link" && /^https?:\/\//.test(feat.uri)) href = feat.uri;
      else if (feat.$type === "app.bsky.richtext.facet#tag") href = "https://bsky.app/hashtag/" + encodeURIComponent(feat.tag);
      else if (feat.$type === "app.bsky.richtext.facet#mention") href = "https://bsky.app/profile/" + feat.did;
      if (href) {
        const a = document.createElement("a");
        a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label;
        frag.append(a);
      } else frag.append(label);
      pos = e;
    }
    frag.append(dec.decode(bytes.slice(pos)));
  } catch { frag.textContent = ""; frag.append(text); }
  return frag;
}

function postMedia(embed) {
  if (!embed) return null;
  const media = embed.media || embed;  // recordWithMedia の場合は media の中
  const img = media.images?.[0]?.thumb || media.thumbnail;
  if (img && /^https:/.test(img)) {
    const el = document.createElement("img");
    el.className = "pimg"; el.loading = "lazy"; el.src = img; el.alt = media.images?.[0]?.alt || "";
    el.referrerPolicy = "no-referrer"; el.onerror = () => el.remove();
    return el;
  }
  const ext = media.external;
  if (ext && /^https?:\/\//.test(ext.uri)) {
    const a = document.createElement("a");
    a.className = "pcard"; a.href = ext.uri; a.target = "_blank"; a.rel = "noopener";
    if (ext.thumb && /^https:/.test(ext.thumb)) {
      const im = document.createElement("img"); im.src = ext.thumb; im.loading = "lazy"; im.alt = "";
      im.referrerPolicy = "no-referrer"; im.onerror = () => im.remove(); a.appendChild(im);
    }
    const d = document.createElement("div");
    const b = document.createElement("b"); b.textContent = ext.title || ext.uri;
    const sm = document.createElement("small");
    try { sm.textContent = new URL(ext.uri).hostname.replace(/^www\./, ""); } catch {}
    d.append(b, sm); a.appendChild(d);
    return a;
  }
  return null;
}

function renderSns(posts) {
  const list = $("snsList");
  list.innerHTML = "";
  if (!posts.length) { list.innerHTML = `<div class="sns-note">このカテゴリーの最近の投稿はありません。公式・記者アカウントがまだ Bluesky に少ないシリーズです。</div>`; return; }
  for (const p of posts) {
    const a = p.author || {};
    const url = `https://bsky.app/profile/${a.handle || a.did}/post/${p.uri.split("/").pop()}`;
    const el = document.createElement("article");
    el.className = "post";
    el.onclick = e => { if (!e.target.closest("a")) window.open(url, "_blank", "noopener"); };

    const head = document.createElement("div"); head.className = "phead";
    if (a.avatar && /^https:/.test(a.avatar)) {
      const av = document.createElement("img"); av.className = "av"; av.src = a.avatar; av.alt = ""; av.loading = "lazy";
      av.referrerPolicy = "no-referrer"; head.appendChild(av);
    }
    const nm = document.createElement("span"); nm.className = "pname"; nm.textContent = a.displayName || a.handle;
    const hd = document.createElement("span"); hd.className = "phandle"; hd.textContent = "@" + a.handle;
    const tm = document.createElement("span"); tm.className = "ptime"; tm.textContent = ago(new Date(p.indexedAt));
    head.append(nm, hd, tm);

    const body = document.createElement("div"); body.className = "ptext"; body.appendChild(richText(p.record || {}));
    el.append(head, body);
    const media = postMedia(p.embed);
    if (media) el.appendChild(media);

    const foot = document.createElement("div"); foot.className = "pfoot";
    foot.textContent = `♡ ${p.likeCount || 0}　↻ ${p.repostCount || 0}　💬 ${p.replyCount || 0}`;
    el.appendChild(foot);
    list.appendChild(el);
  }
}

$("snsReload").onclick = () => loadSns(true);

  document.body.classList.toggle("sns-open", open);

  render();
}
$("snsClose").onclick = () => setSnsOpen(false);

function setView(v) {
  document.body.classList.remove("sns-open");

for (const b of $("bottomNav").children) {

$("filterBtn").onclick = () => openFilters(!document.body.classList.contains("filters-open"), true);

document.addEventListener("keydown", e => {

$("toTop").onclick = () => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });

// 固定ヘッダーの高さに合わせて SNS パネルの位置を決める
const setHdr = () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
new ResizeObserver(setHdr).observe(document.querySelector("header"));

// data.js を読み直す（公開版では GitHub Actions が 30 分ごとに作り直している）
let reloading = false;
function reloadData(manual) {
  if (reloading) return;
  reloading = true;
  const btn = $("refresh"), prev = window.FEED_DATA && window.FEED_DATA.generated;
  if (manual) { btn.disabled = true; btn.textContent = "確認中…"; }
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  const done = msg => {
    s.remove(); reloading = false;
    btn.disabled = false; btn.textContent = "更新";
    if (manual && msg) flash(msg);
  };
  s.onload = () => {
    if (window.FEED_DATA && window.FEED_DATA.generated !== prev) {
      load(); renderSources(); render();
      done("新しい記事を読み込みました");
    } else {
      if (window.FEED_DATA) { updateLabel(); render(); }  // 「○分前」の表示だけ更新
      done(location.protocol === "file:" ? "最新です（取り直すには「更新して開く.command」を実行）" : "最新です（記事は 30 分ごとに自動取得されます）");
    }
  };
  s.onerror = () => done("読み込めませんでした。通信状況を確認してください");
  document.head.appendChild(s);
  reloadSchedule();
}

function reloadSchedule() {
  const s = document.createElement("script");
  s.src = "schedule.js?t=" + Date.now();
  s.onload = () => { s.remove(); if (state.view === "schedule") render(); };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}

let flashTimer;
function flash(msg) {
  const el = $("msg");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

$("refresh").onclick = () => reloadData(true);
// 開きっぱなしでも 10 分ごと、タブに戻ってきたときにも確認する
setInterval(() => { if (!document.hidden) reloadData(false); }, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reloadData(false); });

if (!load()) {
  $("list").innerHTML = `<div class="notice">データがありません。ターミナルで <code>./fetch.sh</code> を実行するか、「更新して開く.command」をダブルクリックしてください。</div>`;
}
{
  for (const b of $("lang").children) {
    b.classList.toggle("on", b.dataset.v === state.lang);
    b.onclick = () => {
      state.lang = b.dataset.v; store.set("msr.lang", state.lang);
      for (const x of $("lang").children) x.classList.toggle("on", x === b);
      renderSources(); render();
    };
  }
  $("source").onchange = e => { state.source = e.target.value; render(); };
  $("q").oninput = e => { state.q = e.target.value; state.limit = 60; render(); };
  $("hideRead").checked = state.hideRead;
  $("hideRead").onchange = e => { state.hideRead = e.target.checked; store.set("msr.hideRead", state.hideRead); render(); };
  for (const b of $("view").children) {
    b.onclick = () => setView(b.dataset.v);
  }
  if (items.length || state.view === "schedule") { renderSources(); render(); } else maybeLoadSns();
}
