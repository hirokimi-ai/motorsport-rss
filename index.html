<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorsport RSS</title>
<style>
:root {
  --bg: #f4f4f2; --surface: #ffffff; --text: #18181b; --muted: #6b6b73;
  --line: #e2e2de; --accent: #d7261e; --accent-soft: #fde8e6; --chip: #ececea;
  --read: #9a9aa2; --maxw: 1400px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --surface: #1b1b1f; --text: #ececef; --muted: #9a9aa4;
    --line: #2c2c32; --accent: #ff4a3d; --accent-soft: #3a1714; --chip: #26262c;
    --read: #66666e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { max-width: var(--maxw); margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
h1 span { color: var(--accent); }
.updated { color: var(--muted); font-size: 12px; }
.updated.stale { color: var(--accent); }
.refresh { margin-left: auto; align-self: center; font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 8px; border: 0;
  background: var(--accent); color: #fff; cursor: pointer; }
.refresh:disabled { opacity: .6; cursor: default; }
.msg { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 8px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
.msg.show { opacity: 1; transform: translate(-50%, 0); }
nav { max-width: var(--maxw); margin: 0 auto; padding: 8px 16px 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
  padding: 8px 12px 10px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
nav button small { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 400; }
.filters { max-width: var(--maxw); margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
input[type=search], select { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); border-radius: 8px; }
input[type=search] { flex: 1; min-width: 140px; }
label.chk { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
main { min-width: 0; padding: 4px 0 48px; }
.item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item .body { flex: 1; min-width: 0; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.src { font-weight: 600; color: var(--text); }
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; font-size: 11px; font-weight: 600; }
.item a.title { display: block; color: var(--text); text-decoration: none; font-weight: 600; font-size: 16px; margin: 3px 0; overflow-wrap: anywhere; }
.item a.title:hover { color: var(--accent); }
.item.read a.title { color: var(--read); font-weight: 500; }
.desc { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thumb { flex: none; width: 120px; height: 72px; border-radius: 6px; object-fit: cover; background: var(--chip); }
@media (max-width: 560px) { .thumb { width: 84px; height: 56px; } .desc { display: none; } }
.empty, .notice { color: var(--muted); padding: 32px 0; text-align: center; }
.notice code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
.errors { font-size: 12px; color: var(--muted); padding: 16px 0; }
.more { display: block; margin: 20px auto; font: inherit; padding: 8px 20px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer; }

/* 左 3/4 が記事、右 1/4 が SNS */
.layout { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
#sns { position: sticky; top: var(--hdr, 140px); height: calc(100vh - var(--hdr, 140px)); display: flex; flex-direction: column;
  border-left: 1px solid var(--line); padding-left: 16px; }
.sns-head { display: flex; align-items: center; gap: 8px; padding: 12px 0 4px; }
.sns-head b { font-size: 15px; }
.sns-head .via { font-size: 12px; color: var(--muted); }
.sns-head button { border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: 13px;
  border-radius: 8px; padding: 2px 10px; cursor: pointer; }
.sns-head #snsReload { margin-left: auto; }
.sns-close { display: none; }
.sns-tags { font-size: 12px; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.sns-tags span { color: var(--accent); font-weight: 600; margin-right: 6px; display: inline-block; white-space: nowrap; }
#snsList { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }
.post { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.phead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--chip); flex: none; }
.pname { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.phandle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ptime { flex: none; }
.ptext { font-size: 13.5px; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ptext a { color: var(--accent); text-decoration: none; }
.ptext a:hover { text-decoration: underline; }
.pimg { display: block; width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; background: var(--chip); }
.pcard { display: flex; gap: 8px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  color: var(--text); text-decoration: none; font-size: 12px; background: var(--surface); }
.pcard img { width: 64px; height: 64px; object-fit: cover; flex: none; }
.pcard div { padding: 6px 8px 6px 0; min-width: 0; }
.pcard b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
.pcard small { color: var(--muted); }
.pfoot { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; }
.sns-note { font-size: 12px; color: var(--muted); padding: 24px 0; text-align: center; }
.sns-fab { display: none; position: fixed; right: 16px; bottom: 20px; z-index: 15; border: 0; border-radius: 999px;
  background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 18px;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }
/* 日程・配信 */
.seg.view { align-self: center; }
.seg.view button { font-weight: 600; }
body.view-schedule .filters { display: none; }
body.view-schedule nav { padding-bottom: 8px; }
.sch-intro { font-size: 12px; color: var(--muted); padding: 14px 0 4px; }
.bc-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0 6px; }
.bc-box h3 { margin: 0 0 8px; font-size: 14px; }
.bc-box ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.bc-box li { font-size: 13px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bc-box li a { color: var(--text); font-weight: 600; }
.bc-box li b { font-weight: 600; }
.bc-box li span { color: var(--muted); font-size: 12px; }
.kind { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.month { font-size: 13px; font-weight: 700; color: var(--muted); padding: 18px 0 6px; border-bottom: 2px solid var(--line); }
.ev { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.ev.next { background: var(--accent-soft); margin: 0 -12px; padding: 14px 12px; border-radius: 10px; border-bottom: 0; }
.ev-date { flex: none; width: 72px; text-align: center; line-height: 1.3; }
.ev-date b { display: block; font-size: 20px; }
.ev-date small { color: var(--muted); font-size: 12px; }
.ev-date span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.ev-body { flex: 1; min-width: 0; }
.ev-name { font-weight: 700; font-size: 17px; margin: 2px 0; }
.ev-venue { font-size: 13px; color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; }
.badge.live { background: var(--accent); color: #fff; }
.badge.soon { color: var(--accent); }
.badge.prov { color: var(--muted); border: 1px solid var(--line); }
.sessions { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; }
.ses { font-size: 12px; background: var(--chip); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
.ses b { margin-right: 4px; }
.ses.race { background: var(--accent); color: #fff; }
.ses.past { opacity: .45; }
.ses-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bc-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; align-items: center; font-size: 12px; }
.bc-chips > span:first-child { color: var(--muted); }
.bc-chips a, .bc-chips em { font-style: normal; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
  text-decoration: none; background: var(--surface); }
.bc-chips a:hover { border-color: var(--accent); color: var(--accent); }
.sch-foot { font-size: 12px; color: var(--muted); padding: 24px 0; line-height: 1.8; }
.sch-foot a { color: var(--muted); }
@media (max-width: 560px) { .ev-date { width: 56px; } .ev-date b { font-size: 17px; } }

@media (max-width: 899px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #sns { display: none; }
  body.sns-open { overflow: hidden; }
  body.sns-open #sns { display: flex; position: fixed; inset: 0; height: auto; z-index: 20; background: var(--bg);
    border-left: 0; padding: 0 16px; }
  .sns-fab { display: block; }
  body.sns-open .sns-fab { display: none; }
  .sns-close { display: inline-block; }
}
</style>
</head>
<body>
<header>
  <div class="top"><h1><span>●</span> Motorsport RSS</h1>
    <div class="seg view" id="view"><button data-v="news">ニュース</button><button data-v="schedule">日程・配信</button></div>
    <div class="updated" id="updated"></div><button id="refresh" class="refresh">更新</button></div>
  <div class="msg" id="msg" role="status"></div>
  <nav id="tabs"></nav>
  <div class="filters">
    <div class="seg" id="lang">
      <button data-v="all" class="on">すべて</button><button data-v="ja">日本語</button><button data-v="en">English</button>
    </div>
    <select id="source"></select>
    <input type="search" id="q" placeholder="キーワードで絞り込み">
    <label class="chk"><input type="checkbox" id="hideRead"> 既読を隠す</label>
  </div>
</header>
<div class="layout">
  <main id="list"></main>
  <aside id="sns" aria-label="SNS の投稿">
    <div class="sns-head">
      <b>SNS</b><span class="via">Bluesky の公式・記者アカウント</span>
      <button id="snsReload" title="SNS を再読み込み">↻</button>
      <button id="snsClose" class="sns-close" title="閉じる">閉じる</button>
    </div>
    <div class="sns-tags" id="snsTags"></div>
    <div id="snsList"></div>
  </aside>
</div>
<button id="snsFab" class="sns-fab">SNS</button>

<script src="data.js"></script>
<script src="schedule.js"></script>
<script>
const CATS = [
  { id: "all", label: "すべて" },
  { id: "f1", label: "F1", re: /\bF1\b|Formula ?1|Formula One|フォーミュラ1|グランプリ|Grand Prix/i },
  { id: "supergt", label: "スーパーGT", re: /スーパーGT|SUPER ?GT/i },
  { id: "superformula", label: "スーパーフォーミュラ", re: /スーパーフォーミュラ|Super ?Formula/i },
  { id: "motogp", label: "MotoGP・二輪", re: /MotoGP|Moto2|Moto3|WSBK|WorldSBK|スーパーバイク|8耐|鈴鹿8時間/i },
  { id: "wec", label: "WEC・耐久", re: /\bWEC\b|ル・マン|Le ?Mans|IMSA|耐久|Endurance|Daytona|Hypercar|ハイパーカー|スーパー耐久/i },
  { id: "wrc", label: "WRC・ラリー", re: /\bWRC\b|ラリー|Rally|ダカール|Dakar/i },
  { id: "indy", label: "インディ・NASCAR", re: /IndyCar|インディ|Indy ?500|NASCAR/i },
  { id: "fe", label: "フォーミュラE", re: /Formula ?E\b|フォーミュラE/i },
  { id: "other", label: "その他" },
];
const CAT_LABEL = Object.fromEntries(CATS.map(c => [c.id, c.label]));
// 自動分類で F1 と誤判定しやすいので、二輪などを先に判定し F1 は最後に見る
const AUTO_ORDER = ["supergt", "superformula", "fe", "motogp", "wec", "wrc", "indy", "f1"];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  view: store.get("msr.view", "news"),
  cat: store.get("msr.cat", "all"), lang: store.get("msr.lang", "all"), source: "all", q: "",
  hideRead: store.get("msr.hideRead", false), limit: 60,
};
const readSet = new Set(store.get("msr.read", []));

const $ = id => document.getElementById(id);
const textOf = html => {
  if (!html) return "";
  const d = new DOMParser().parseFromString(html, "text/html");
  return (d.body.textContent || "").replace(/\s+/g, " ").trim();
};
const firstImg = html => {
  const m = html && html.match(/<img[^>]+src=["']([^"']+)/i);
  return m ? m[1] : "";
};
const decode = b64 => new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

function child(el, ...names) {
  for (const n of names) {
    for (const c of el.children) if (c.localName === n || c.nodeName === n) return c;
  }
  return null;
}

function parseFeed(feed) {
  const doc = new DOMParser().parseFromString(decode(feed.b64), "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("XML parse error");
  const nodes = [...doc.getElementsByTagName("item"), ...doc.getElementsByTagName("entry")];
  return nodes.map(n => {
    const title = textOf(child(n, "title")?.textContent || "");
    const linkEl = child(n, "link");
    const link = (linkEl?.getAttribute("href") || linkEl?.textContent || "").trim();
    const dateStr = child(n, "pubDate", "published", "updated", "dc:date")?.textContent;
    const rawDesc = child(n, "description", "summary")?.textContent || "";
    const content = child(n, "content:encoded", "encoded", "content")?.textContent || "";
    const tags = [...n.getElementsByTagName("category")].map(c => c.textContent || c.getAttribute("term") || "");
    const enc = child(n, "enclosure");
    const media = n.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "content")[0]
      || n.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "thumbnail")[0];
    let img = (enc && /image/.test(enc.getAttribute("type") || "image") && enc.getAttribute("url"))
      || media?.getAttribute("url") || firstImg(rawDesc) || firstImg(content) || "";
    const desc = textOf(rawDesc).slice(0, 220);
    const date = dateStr ? new Date(dateStr.trim()) : null;

    let cats;
    if (feed.cat === "auto") {
      const hay = title + " " + tags.join(" ");
      const hit = AUTO_ORDER.filter(id => CATS.find(c => c.id === id).re.test(hay));
      // F1 は他カテゴリに当たったら除外（「MotoGP グランプリ」などの誤判定対策）
      cats = hit.length > 1 ? hit.filter(c => c !== "f1") : hit;
      if (!cats.length) cats = ["other"];
    } else cats = [feed.cat];

    return { title, link, date: date && !isNaN(date) ? date : null, desc, img, cats,
      source: feed.name, lang: feed.lang };
  }).filter(i => i.title && i.link);
}

const errors = [];
let items = [];
function load() {
  const data = window.FEED_DATA;
  if (!data) return false;
  errors.length = 0;
  const seen = new Map();
  for (const f of data.feeds) {
    if (!f.ok) { errors.push(`${f.name}（${f.cat}）: HTTP ${f.status}`); continue; }
    try {
      for (const it of parseFeed(f)) {
        const key = it.link.split("?")[0];
        const prev = seen.get(key);
        if (prev) { prev.cats = [...new Set([...prev.cats, ...it.cats])]; continue; }
        seen.set(key, it);
      }
    } catch (e) { errors.push(`${f.name}（${f.cat}）: ${e.message}`); }
  }
  items = [...seen.values()].sort((a, b) => (b.date || 0) - (a.date || 0));
  updateLabel();
  return true;
}

function updateLabel() {
  const gen = new Date(window.FEED_DATA.generated);
  const ageMin = (Date.now() - gen) / 60000;
  const el = $("updated");
  el.textContent = `取得: ${gen.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}（${ago(gen)}）`
    + (ageMin > 60 && location.protocol === "file:" ? " — 「更新して開く.command」で最新化できます" : "");
  el.classList.toggle("stale", ageMin > 60);
}

function ago(d) {
  if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "たった今";
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}時間前`;
  return `${Math.round(h / 24)}日前`;
}

function baseFiltered() {
  const q = state.q.toLowerCase();
  return items.filter(i =>
    (state.lang === "all" || i.lang === state.lang) &&
    (state.source === "all" || i.source === state.source) &&
    (!state.hideRead || !readSet.has(i.link)) &&
    (!q || (i.title + " " + i.desc).toLowerCase().includes(q)));
}

function renderTabs(base) {
  const counts = {};
  for (const i of base) for (const c of i.cats) counts[c] = (counts[c] || 0) + 1;
  drawTabs(counts, base.length);
}

function drawTabs(counts, total) {
  $("tabs").innerHTML = "";
  for (const c of CATS) {
    if (c.id === "other" && state.view === "schedule") continue;  // 日程に「その他」はない
    const n = c.id === "all" ? total : (counts[c.id] || 0);
    const b = document.createElement("button");
    b.className = c.id === state.cat ? "on" : "";
    b.innerHTML = `${c.label}<small>${n}</small>`;
    b.onclick = () => { state.cat = c.id; state.limit = 60; store.set("msr.cat", c.id); render(); window.scrollTo(0, 0); };
    $("tabs").appendChild(b);
  }
}

function renderSources() {
  const names = [...new Set(items.filter(i => state.lang === "all" || i.lang === state.lang).map(i => i.source))].sort();
  if (state.source !== "all" && !names.includes(state.source)) state.source = "all";
  $("source").innerHTML = `<option value="all">すべてのサイト</option>` +
    names.map(n => `<option${n === state.source ? " selected" : ""}></option>`).join("");
  [...$("source").options].slice(1).forEach((o, k) => { o.value = o.textContent = names[k]; });
  $("source").value = state.source;
}

function render() {
  maybeLoadSns();
  document.body.classList.toggle("view-schedule", state.view === "schedule");
  for (const b of $("view").children) b.classList.toggle("on", b.dataset.v === state.view);
  if (state.view === "schedule") { renderSchedule(); return; }
  const base = baseFiltered();
  renderTabs(base);
  const list = state.cat === "all" ? base : base.filter(i => i.cats.includes(state.cat));
  const main = $("list");
  main.innerHTML = "";
  if (!list.length) main.innerHTML = `<div class="empty">記事がありません</div>`;
  for (const i of list.slice(0, state.limit)) {
    const row = document.createElement("article");
    row.className = "item" + (readSet.has(i.link) ? " read" : "");
    const body = document.createElement("div");
    body.className = "body";
    const meta = document.createElement("div");
    meta.className = "meta";
    const src = document.createElement("span"); src.className = "src"; src.textContent = i.source; meta.appendChild(src);
    if (state.cat === "all" || i.cats.length > 1)
      for (const c of i.cats) { const t = document.createElement("span"); t.className = "tag"; t.textContent = CAT_LABEL[c]; meta.appendChild(t); }
    const tm = document.createElement("span"); tm.textContent = ago(i.date);
    if (i.date) tm.title = i.date.toLocaleString("ja-JP");
    meta.appendChild(tm);
    const a = document.createElement("a");
    a.className = "title"; a.href = i.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = i.title;
    a.onclick = () => { readSet.add(i.link); store.set("msr.read", [...readSet].slice(-3000)); row.classList.add("read"); };
    const d = document.createElement("div"); d.className = "desc"; d.textContent = i.desc;
    body.append(meta, a, d);
    row.appendChild(body);
    if (i.img && /^https?:/.test(i.img)) {
      const img = document.createElement("img");
      img.className = "thumb"; img.loading = "lazy"; img.src = i.img; img.alt = ""; img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();

    }
    main.appendChild(row);
  }
  if (list.length > state.limit) {
    const m = document.createElement("button");
    m.className = "more"; m.textContent = `さらに表示（残り ${list.length - state.limit} 件）`;
    m.onclick = () => { state.limit += 60; render(); };

    e.className = "errors"; e.textContent = "取得できなかったフィード: " + errors.join(" / ");

// ---- 日程・配信（schedule.js。F1 と MotoGP はセッション時刻つき） ----
const SERIES_LABEL = { f1: "F1", supergt: "スーパーGT", superformula: "スーパーフォーミュラ", motogp: "MotoGP",
  wec: "WEC", wrc: "WRC", indy: "インディカー", fe: "フォーミュラE" };
const JST = "Asia/Tokyo";
const fmtSession = new Intl.DateTimeFormat("ja-JP", { timeZone: JST, month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
const fmtYmd = new Intl.DateTimeFormat("en-CA", { timeZone: JST, year: "numeric", month: "2-digit", day: "2-digit" });
const todayJST = () => fmtYmd.format(new Date());
// "2027-03-07" → { md: "3/7", wd: "日" }（日付だけのデータなので UTC の正午で曜日を出す）
function dayParts(ymd) {
  const d = new Date(ymd + "T12:00:00Z");
  return { md: `${d.getUTCMonth() + 1}/${d.getUTCDate()}`, wd: "日月火水木金土"[d.getUTCDay()] };
}
function daysUntil(ymd) {
  return Math.round((new Date(ymd + "T00:00:00Z") - new Date(todayJST() + "T00:00:00Z")) / 86400000);
}

function scheduleEvents() {
  const d = window.SCHEDULE_DATA;
  if (!d) return [];
  const today = todayJST();
  return d.events.filter(e => e.end >= today);
}

function broadcastLinks(list, withDetail) {
  return (list || []).map(b => {
    const el = document.createElement(b.url ? "a" : "em");
    if (b.url) { el.href = b.url; el.target = "_blank"; el.rel = "noopener"; }
    el.textContent = b.name;
    el.title = [b.kind, b.detail].filter(Boolean).join(" · ");
    if (!withDetail) return el;
    const li = document.createElement("li");
    const kind = document.createElement("span"); kind.className = "kind"; kind.textContent = b.kind || "";
    const name = document.createElement(b.url ? "a" : "b");
    if (b.url) { name.href = b.url; name.target = "_blank"; name.rel = "noopener"; }
    name.textContent = b.name;
    const detail = document.createElement("span"); detail.textContent = b.detail || "";
    li.append(kind, name, detail);
    return li;
  });
}

function renderSchedule() {
  const data = window.SCHEDULE_DATA;
  const all = scheduleEvents();
  const counts = {};
  for (const e of all) counts[e.series] = (counts[e.series] || 0) + 1;
  drawTabs(counts, all.length);

  const main = $("list");
  main.innerHTML = "";
  if (!data) {
    main.innerHTML = `<div class="notice">日程データがありません。ターミナルで <code>./fetch.sh</code> を実行してください。</div>`;
    return;
  }
  const list = state.cat === "all" ? all : all.filter(e => e.series === state.cat);
  const intro = document.createElement("div");
  intro.className = "sch-intro";
  intro.textContent = "時刻はすべて日本時間です。F1・MotoGP はセッションごとの時刻を表示しています。";
  main.appendChild(intro);

  // カテゴリーを選んでいるときは、そのシリーズの配信先を詳しく出す
  const bcs = data.broadcasts[state.cat];
  if (bcs) {
    const box = document.createElement("div"); box.className = "bc-box";
    const h = document.createElement("h3"); h.textContent = `${SERIES_LABEL[state.cat]} の日本での視聴方法`;
    const ul = document.createElement("ul"); ul.append(...broadcastLinks(bcs, true));
    box.append(h, ul);
    main.appendChild(box);
  }

  if (!list.length) {
    main.insertAdjacentHTML("beforeend", `<div class="empty">このカテゴリーの今後の日程はまだ発表されていません</div>`);
  }
  const now = Date.now(), today = todayJST();
  let month = "", markedNext = false;
  for (const e of list) {
    const m = e.start.slice(0, 7);
    if (m !== month) {
      month = m;
      const h = document.createElement("div"); h.className = "month";
      h.textContent = `${m.slice(0, 4)}年${Number(m.slice(5))}月`;
      main.appendChild(h);
    }
    const ev = document.createElement("article");
    ev.className = "ev";
    if (!markedNext) { ev.classList.add("next"); markedNext = true; }

    const s = dayParts(e.start), en = dayParts(e.end);
    const date = document.createElement("div"); date.className = "ev-date";
    date.innerHTML = `<b></b><small></small>`;
    date.querySelector("b").textContent = s.md;
    date.querySelector("small").textContent = `(${s.wd})`;
    if (e.end !== e.start) { const t = document.createElement("span"); t.textContent = `〜${en.md}(${en.wd})`; date.appendChild(t); }

    const body = document.createElement("div"); body.className = "ev-body";
    const meta = document.createElement("div"); meta.className = "meta";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = SERIES_LABEL[e.series] || e.series;
    meta.appendChild(tag);
    if (e.round) meta.append(e.round);
    const badge = document.createElement("span"); badge.className = "badge";
    const d = daysUntil(e.start);
    if (e.start <= today && today <= e.end) { badge.classList.add("live"); badge.textContent = "開催中"; }
    else if (d === 1) { badge.classList.add("soon"); badge.textContent = "明日から"; }
    else if (d <= 14) { badge.classList.add("soon"); badge.textContent = `あと ${d} 日`; }
    if (badge.textContent) meta.appendChild(badge);
    if (e.provisional) { const p = document.createElement("span"); p.className = "badge prov"; p.textContent = "暫定"; meta.appendChild(p); }

    const name = document.createElement("div"); name.className = "ev-name"; name.textContent = e.name;
    const venue = document.createElement("div"); venue.className = "ev-venue";
    venue.textContent = [e.venue, e.note].filter(Boolean).join(" · ");
    body.append(meta, name, venue);

    if (e.sessions && e.sessions.length) {
      const ss = document.createElement("div"); ss.className = "sessions";
      for (const x of e.sessions) {
        const t = new Date(x.time);
        const el = document.createElement("span");
        el.className = "ses" + (x.name === "決勝" ? " race" : "") + (t.getTime() + 2 * 3600000 < now ? " past" : "");
        const b = document.createElement("b"); b.textContent = x.name;
        el.append(b, fmtSession.format(t));
        ss.appendChild(el);
      }
      body.appendChild(ss);
    } else {
      const n = document.createElement("div"); n.className = "ses-note";
      n.textContent = "セッションの時刻は未発表です。";
      body.appendChild(n);
    }

    const chips = document.createElement("div"); chips.className = "bc-chips";
    const label = document.createElement("span"); label.textContent = "配信";
    chips.append(label, ...broadcastLinks(data.broadcasts[e.series], false));
    body.appendChild(chips);

    ev.append(date, body);
    main.appendChild(ev);
  }

  const foot = document.createElement("div"); foot.className = "sch-foot";
  const gen = new Date(data.generated);
  foot.append(`${data.broadcastNote} F1・MotoGP の日程は ${gen.toLocaleString("ja-JP", { timeZone: JST })} に自動取得、それ以外のシリーズは ${data.manualUpdated} 時点の発表をもとにしています。「暫定」は主催者が予定として発表した日程です。`);
  foot.appendChild(document.createElement("br"));
  foot.append("出典: ");
  data.sources.forEach((src, i) => {
    const a = document.createElement("a"); a.href = src.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = src.label;
    if (i) foot.append(" / ");
    foot.appendChild(a);
  });
  main.appendChild(foot);
}

];
const BSKY_FEED = "https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed";
// 成人向け・暴力的・スパムのラベルが付いた投稿は表示しない
const BLOCKED_LABELS = new Set(["porn", "sexual", "sexual-figurative", "nudity", "graphic-media", "gore", "spam", "!hide", "!warn"]);
const accountCache = new Map();  // handle -> { t, posts: [{ post, cats }] }
let snsSeq = 0, snsKey = "";

function snsVisible() {
  return getComputedStyle($("sns")).display !== "none";
}

function maybeLoadSns() {
  const key = state.cat + "|" + state.lang;
  if (key !== snsKey) loadSns(false);
}

function classifyText(text) {
  const hits = AUTO_ORDER.filter(id => CATS.find(c => c.id === id).re.test(text));
  return hits.length > 1 ? hits.filter(c => c !== "f1") : hits;
}

async function fetchAccount(acc) {
  const p = new URLSearchParams({ actor: acc.handle, limit: 30, filter: "posts_no_replies" });
  const r = await fetch(`${BSKY_FEED}?${p}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const posts = ((await r.json()).feed || [])
    .filter(item => !item.reason)  // リポストは除き、本人の投稿だけにする
    .map(item => item.post)
    .filter(p => ![...(p.labels || []), ...(p.author?.labels || [])].some(l => BLOCKED_LABELS.has(l.val)))
    .map(post => {
      let cats = [acc.cat];
      if (acc.auto) {
        const hit = classifyText((post.record?.text || "") + " " + (post.embed?.external?.title || ""));
        if (hit.length) cats = hit;
      }
      return { post, cats, lang: acc.lang || "en" };
    });
  accountCache.set(acc.handle, { t: Date.now(), posts });
}

async function loadSns(force) {
  const key = snsKey = state.cat + "|" + state.lang;
  const cat = state.cat;
  const accounts = cat === "all" ? SNS_ACCOUNTS : SNS_ACCOUNTS.filter(a => a.auto || a.cat === cat);
  const named = cat === "all" ? SNS_ACCOUNTS : accounts.filter(a => a.cat === cat);
  $("snsTags").textContent = cat === "all" || cat === "other"
    ? `公式・記者 ${SNS_ACCOUNTS.length} アカウント`
    : named.length ? named.map(a => a.note).filter((v, i, s) => s.indexOf(v) === i).join("・") + " ほか" : "複数シリーズを扱うアカウントから";
  if (state.lang !== "all") $("snsTags").append(`（${state.lang === "ja" ? "日本語" : "English"}）`);

  const stale = accounts.filter(a => force || !accountCache.has(a.handle) || Date.now() - accountCache.get(a.handle).t > 120000);
  if (!stale.length) { renderSns(collectPosts(accounts)); return; }
  const hasAny = accounts.some(a => accountCache.has(a.handle));
  if (hasAny) renderSns(collectPosts(accounts));
  else $("snsList").innerHTML = `<div class="sns-note">読み込み中…</div>`;
  if (!snsVisible() && !force) return;  // スマホでパネルを閉じているときは取りに行かない

  const seq = ++snsSeq;
  const results = await Promise.allSettled(stale.map(fetchAccount));
  if (seq !== snsSeq || key !== snsKey) return;  // 途中でカテゴリーが切り替わった
  if (!results.some(r => r.status === "fulfilled") && !hasAny) {
    $("snsList").innerHTML = `<div class="sns-note">Bluesky に接続できませんでした。↻ で再試行してください。</div>`;
    return;
  }
  renderSns(collectPosts(accounts));
}

function collectPosts(accounts) {
  const cat = state.cat, lang = state.lang;
  return accounts.flatMap(a => accountCache.get(a.handle)?.posts || [])
    .filter(x => cat === "all" || x.cats.includes(cat))
    .filter(x => {
      if (lang === "all") return true;
      const l = x.post.record?.langs;
      return l && l.length ? l.some(v => v.startsWith(lang)) : x.lang === lang;
    })
    .map(x => x.post)
    .sort((a, b) => new Date(b.indexedAt) - new Date(a.indexedAt))
    .slice(0, 60);
}

// 本文中のリンク・ハッシュタグ・メンションを facets（UTF-8 のバイト位置）から復元する
function richText(record) {
  const frag = document.createDocumentFragment();
  const text = record.text || "";
  const facets = (record.facets || []).slice().sort((a, b) => a.index.byteStart - b.index.byteStart);
  try {
    const bytes = new TextEncoder().encode(text), dec = new TextDecoder();
    let pos = 0;
    for (const f of facets) {
      const { byteStart: s, byteEnd: e } = f.index;
      if (s < pos || e > bytes.length || s >= e) continue;
      frag.append(dec.decode(bytes.slice(pos, s)));
      const feat = f.features?.[0] || {};
      const label = dec.decode(bytes.slice(s, e));
      let href = null;
      if (feat.$type === "app.bsky.richtext.facet#link" && /^https?:\/\//.test(feat.uri)) href = feat.uri;
      else if (feat.$type === "app.bsky.richtext.facet#tag") href = "https://bsky.app/hashtag/" + encodeURIComponent(feat.tag);
      else if (feat.$type === "app.bsky.richtext.facet#mention") href = "https://bsky.app/profile/" + feat.did;
      if (href) {
        const a = document.createElement("a");
        a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = label;
        frag.append(a);
      } else frag.append(label);
      pos = e;
    }
    frag.append(dec.decode(bytes.slice(pos)));
  } catch { frag.textContent = ""; frag.append(text); }
  return frag;
}

function postMedia(embed) {
  if (!embed) return null;
  const media = embed.media || embed;  // recordWithMedia の場合は media の中
  const img = media.images?.[0]?.thumb || media.thumbnail;
  if (img && /^https:/.test(img)) {
    const el = document.createElement("img");
    el.className = "pimg"; el.loading = "lazy"; el.src = img; el.alt = media.images?.[0]?.alt || "";
    el.referrerPolicy = "no-referrer"; el.onerror = () => el.remove();
    return el;
  }
  const ext = media.external;
  if (ext && /^https?:\/\//.test(ext.uri)) {
    const a = document.createElement("a");
    a.className = "pcard"; a.href = ext.uri; a.target = "_blank"; a.rel = "noopener";
    if (ext.thumb && /^https:/.test(ext.thumb)) {
      const im = document.createElement("img"); im.src = ext.thumb; im.loading = "lazy"; im.alt = "";
      im.referrerPolicy = "no-referrer"; im.onerror = () => im.remove(); a.appendChild(im);
    }
    const d = document.createElement("div");
    const b = document.createElement("b"); b.textContent = ext.title || ext.uri;
    const sm = document.createElement("small");
    try { sm.textContent = new URL(ext.uri).hostname.replace(/^www\./, ""); } catch {}
    d.append(b, sm); a.appendChild(d);
    return a;
  }
  return null;
}

function renderSns(posts) {
  const list = $("snsList");
  list.innerHTML = "";
  if (!posts.length) { list.innerHTML = `<div class="sns-note">このカテゴリーの最近の投稿はありません。公式・記者アカウントがまだ Bluesky に少ないシリーズです。</div>`; return; }
  for (const p of posts) {
    const a = p.author || {};
    const url = `https://bsky.app/profile/${a.handle || a.did}/post/${p.uri.split("/").pop()}`;
    const el = document.createElement("article");
    el.className = "post";
    el.onclick = e => { if (!e.target.closest("a")) window.open(url, "_blank", "noopener"); };

    const head = document.createElement("div"); head.className = "phead";
    if (a.avatar && /^https:/.test(a.avatar)) {
      const av = document.createElement("img"); av.className = "av"; av.src = a.avatar; av.alt = ""; av.loading = "lazy";
      av.referrerPolicy = "no-referrer"; head.appendChild(av);
    }
    const nm = document.createElement("span"); nm.className = "pname"; nm.textContent = a.displayName || a.handle;
    const hd = document.createElement("span"); hd.className = "phandle"; hd.textContent = "@" + a.handle;
    const tm = document.createElement("span"); tm.className = "ptime"; tm.textContent = ago(new Date(p.indexedAt));
    head.append(nm, hd, tm);

    const body = document.createElement("div"); body.className = "ptext"; body.appendChild(richText(p.record || {}));
    el.append(head, body);
    const media = postMedia(p.embed);
    if (media) el.appendChild(media);

    const foot = document.createElement("div"); foot.className = "pfoot";
    foot.textContent = `♡ ${p.likeCount || 0}　↻ ${p.repostCount || 0}　💬 ${p.replyCount || 0}`;
    el.appendChild(foot);
    list.appendChild(el);
  }
}

// data.js を読み直す（公開版では GitHub Actions が 30 分ごとに作り直している）
let reloading = false;
function reloadData(manual) {
  if (reloading) return;
  reloading = true;
  const btn = $("refresh"), prev = window.FEED_DATA && window.FEED_DATA.generated;
  if (manual) { btn.disabled = true; btn.textContent = "確認中…"; }
  const s = document.createElement("script");
  s.src = "data.js?t=" + Date.now();
  const done = msg => {
    s.remove(); reloading = false;
    btn.disabled = false; btn.textContent = "更新";
    if (manual && msg) flash(msg);
  };
  s.onload = () => {
    if (window.FEED_DATA && window.FEED_DATA.generated !== prev) {
      load(); renderSources(); render();
      done("新しい記事を読み込みました");
    } else {
      if (window.FEED_DATA) { updateLabel(); render(); }  // 「○分前」の表示だけ更新
      done(location.protocol === "file:" ? "最新です（取り直すには「更新して開く.command」を実行）" : "最新です（記事は 30 分ごとに自動取得されます）");
    }
  };
  s.onerror = () => done("読み込めませんでした。通信状況を確認してください");
  document.head.appendChild(s);
  reloadSchedule();
}

function reloadSchedule() {
  const s = document.createElement("script");
  s.src = "schedule.js?t=" + Date.now();
  s.onload = () => { s.remove(); if (state.view === "schedule") render(); };

  for (const b of $("view").children) {
    b.onclick = () => {
      state.view = b.dataset.v; store.set("msr.view", state.view);
      render(); window.scrollTo(0, 0);
    };
  }
  if (items.length || state.view === "schedule") { renderSources(); render(); } else maybeLoadSns();
}
</script>
</body>
</html>
